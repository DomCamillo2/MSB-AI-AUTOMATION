name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        continue-on-error: true
        run: |
          # Known transitive highs in Next.js 15 (postcss/sharp). Tracked until Next 16 upgrade.
          npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Validate PHP contact endpoint
        shell: bash
        run: |
          php -l public/contact.php
          php -l public/contact-lib/phpmailer/Exception.php
          php -l public/contact-lib/phpmailer/PHPMailer.php
          php -l public/contact-lib/phpmailer/SMTP.php

      - name: Build static IONOS export
        run: npm run build

      - name: Verify export
        shell: bash
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/.htaccess
          test -f out/contact.php
          test -f out/sitemap.xml
          test -f out/robots.txt
          url_count="$(grep -c '<loc>' out/sitemap.xml)"
          if [[ "$url_count" -lt 20 ]]; then
            echo "::error::Sitemap has only $url_count URLs (expected at least 20). A page may have been removed."
            exit 1
          fi
          grep -q 'https://www.msb-ai.de/leistungen/' out/sitemap.xml
          ! grep -q 'impressum' out/sitemap.xml
          grep -q 'Sitemap: https://www.msb-ai.de/sitemap.xml' out/robots.txt
